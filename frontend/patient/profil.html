<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil — Carnet+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__head">
        <button class="hamburger" data-action="toggle-sidebar" title="Réduire le menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M3 12h18M3 18h18" />
          </svg>
        </button>
        <a href="dashboard.html" style="display:inline-flex;text-decoration:none;">
          <div class="logo-mark" style="width:40px;height:40px;background:linear-gradient(135deg,#13b98a,#0d9488);">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
              <path d="M2 21c0-3 1.85-5.36 5.08-6" />
            </svg>
          </div>
        </a>
        <div class="sidebar__logo">Carnet<span style="color:var(--green-2);">+</span>
        </div>
      </div>
      <nav class="sidebar__nav">
        <a class="nav-link" href="dashboard.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
          </svg>Tableau de bord
        </a>
        <a class="nav-link" href="consultations.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="17" rx="2" />
            <path d="M3 9h18M8 2v4M16 2v4" />
          </svg>Consultations
        </a>
        <a class="nav-link" href="messages.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z" />
          </svg>Messages
        </a>
        <a class="nav-link" href="carnet.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h4l2-7 4 14 2-7h6" />
          </svg>Carnet de santé
        </a>
        <a class="nav-link" href="ordonnances.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
            <path d="M14 2v6h6M9 13h6M9 17h6" />
          </svg>Ordonnances
        </a>
        <a class="nav-link" href="evaluations.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 18.6l-5.9 3.1 1.2-6.6L2.5 9.5l6.6-.9Z" />
          </svg>Mes évaluations
        </a>
        <a class="nav-link active" href="profil.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" />
          </svg>Mon profil
        </a>
      </nav>
      <div class="sidebar__foot">
        <div class="user-row">
          <div class="avatar avatar-round" style="width:38px;height:38px;background:linear-gradient(135deg,#f59e0b,#f97316);font-size:14px;">FD</div>
          <div style="flex:1;min-width:0;">
            <div class="name">Fanta Diallo</div>
            <div class="mail">fanta.diallo@email.cg</div>
          </div>
          <a class="icon-btn" href="../index.html" title="Se déconnecter">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>
      </div>
    </aside>
    <button class="hamburger--float" data-action="toggle-sidebar" title="Ouvrir le menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M3 12h18M3 18h18" />
      </svg>
    </button>
    <main class="main">
      <div class="fade container-xs">
        <h1 class="h1">Mon profil</h1>
        <p class="subtitle">Gérez vos informations personnelles et de sécurité.</p>
        <div class="banner" style="padding:26px;display:flex;align-items:center;gap:18px;margin-bottom:20px;box-shadow:0 12px 28px rgba(13,148,136,.2);">
          <div id="profil-avatar" class="avatar avatar-round" style="width:72px;height:72px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;flex:none;cursor:pointer;" title="Cliquer pour changer la photo">--</div>
          <input type="file" id="profil-photo-input" accept="image/*" style="display:none;">
          <div>
            <div id="profil-name" style="font-size:23px;font-weight:800;"></div>
            <div id="profil-email" style="opacity:.85;font-size:14px;margin-top:3px;"></div>
          </div>
        </div>
        <p class="form-error hidden" id="profil-error"></p>
        <form id="profil-form" class="card card--pad" style="border-radius:18px;padding:24px;">
          <div style="font-weight:800;font-size:16px;margin-bottom:18px;">Informations personnelles</div>
          <div class="grid-2">
            <div>
              <label class="label" style="letter-spacing:0;">PRÉNOM</label>
              <input class="input" id="profil-first-name" required>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">NOM</label>
              <input class="input" id="profil-last-name" required>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">EMAIL</label>
              <input class="input" id="profil-email-field" disabled>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">TÉLÉPHONE</label>
              <input class="input" id="profil-phone" required>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">PAYS DE RÉSIDENCE</label>
              <input class="input" id="profil-country" required>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">VILLE</label>
              <input class="input" id="profil-city" required>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">ADRESSE</label>
              <input class="input" id="profil-address" required>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">DATE DE NAISSANCE</label>
              <input class="input" id="profil-dob" disabled>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">LIEU DE NAISSANCE</label>
              <input class="input" id="profil-pob" disabled>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">GROUPE SANGUIN</label>
              <input class="input" id="profil-blood-type" placeholder="Ex. O+">
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">POIDS (KG)</label>
              <input class="input" id="profil-weight" type="number" min="0" step="0.1" placeholder="Ex. 68.5">
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">ALLERGIES</label>
              <input class="input" id="profil-allergies" placeholder="Ex. Pénicilline, poils d'animaux">
            </div>
          </div>
          <div class="row" style="gap:10px;margin-top:22px;">
            <button type="submit" class="btn btn--primary">Enregistrer</button>
            <button type="button" class="btn btn--ghost" id="profil-cancel">Annuler</button>
          </div>
        </form>
        <form id="password-form" class="card card--pad" style="border-radius:18px;padding:24px;margin-top:20px;">
          <div style="font-weight:800;font-size:16px;margin-bottom:18px;">Sécurité</div>
          <div class="grid-2">
            <div style="grid-column:1 / -1;">
              <label class="label" style="letter-spacing:0;">MOT DE PASSE ACTUEL</label>
              <div class="password-field">
                <input class="input" id="password-current" type="password" required>
                <button type="button" class="password-toggle" data-toggle-password="password-current" aria-label="Afficher le mot de passe" tabindex="-1">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" /><circle cx="12" cy="12" r="3" /></svg>
                </button>
              </div>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">NOUVEAU MOT DE PASSE</label>
              <div class="password-field">
                <input class="input" id="password-new" type="password" placeholder="Min. 10 caractères" minlength="10" required>
                <button type="button" class="password-toggle" data-toggle-password="password-new" aria-label="Afficher le mot de passe" tabindex="-1">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" /><circle cx="12" cy="12" r="3" /></svg>
                </button>
              </div>
            </div>
            <div>
              <label class="label" style="letter-spacing:0;">CONFIRMER LE NOUVEAU MOT DE PASSE</label>
              <div class="password-field">
                <input class="input" id="password-new-confirm" type="password" required>
                <button type="button" class="password-toggle" data-toggle-password="password-new-confirm" aria-label="Afficher le mot de passe" tabindex="-1">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" /><circle cx="12" cy="12" r="3" /></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="form-error hidden" id="password-error"></p>
          <p class="hidden" id="password-success" style="color:var(--green-text);font-weight:600;font-size:13.5px;margin-top:14px;">Mot de passe mis à jour.</p>
          <div class="row" style="gap:10px;margin-top:22px;">
            <button type="submit" class="btn btn--primary">Changer le mot de passe</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="../auth.js"></script>
  <script src="../api.js"></script>
  <script src="../app.js"></script>
  <script>
    (function () {
      CarnetAuth.requireAuth('patient');
      var profile = null;

      function fillForm(p) {
        document.getElementById('profil-name').textContent = p.first_name + ' ' + p.last_name;
        document.getElementById('profil-email').textContent = p.email;
        document.getElementById('profil-first-name').value = p.first_name;
        document.getElementById('profil-last-name').value = p.last_name;
        document.getElementById('profil-email-field').value = p.email;
        document.getElementById('profil-phone').value = p.phone_number;
        document.getElementById('profil-country').value = p.country_of_residence;
        document.getElementById('profil-city').value = p.city;
        document.getElementById('profil-address').value = p.address;
        document.getElementById('profil-dob').value = p.date_of_birth;
        document.getElementById('profil-pob').value = p.place_of_birth;
        document.getElementById('profil-blood-type').value = p.blood_type || '';
        document.getElementById('profil-weight').value = p.weight_kg != null ? p.weight_kg : '';
        document.getElementById('profil-allergies').value = p.allergies || '';
        var avatar = document.getElementById('profil-avatar');
        avatar.textContent = (p.first_name[0] || '') + (p.last_name[0] || '');
        avatar.style.backgroundImage = '';
        renderAvatar(avatar, p.photo_url);
      }

      async function load() {
        try {
          profile = await apiGet('/patients/me');
          fillForm(profile);
        } catch (err) {
          document.getElementById('profil-error').textContent = 'Impossible de charger le profil, réessayez.';
          document.getElementById('profil-error').classList.remove('hidden');
        }
      }
      load();

      document.getElementById('profil-avatar').addEventListener('click', function () {
        document.getElementById('profil-photo-input').click();
      });
      document.getElementById('profil-photo-input').addEventListener('change', async function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var errorEl = document.getElementById('profil-error');
        errorEl.classList.add('hidden');
        try {
          var formData = new FormData();
          formData.append('photo', file);
          profile = await apiPostForm('/patients/me/photo', formData);
          fillForm(profile);
        } catch (err) {
          errorEl.textContent = 'Une erreur est survenue, réessayez.';
          errorEl.classList.remove('hidden');
        }
      });

      document.getElementById('profil-cancel').addEventListener('click', function () {
        fillForm(profile);
      });

      document.getElementById('profil-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var errorEl = document.getElementById('profil-error');
        errorEl.classList.add('hidden');
        var weightRaw = document.getElementById('profil-weight').value;
        try {
          profile = await apiRequest('PATCH', '/patients/me', {
            json: {
              first_name: document.getElementById('profil-first-name').value,
              last_name: document.getElementById('profil-last-name').value,
              phone_number: document.getElementById('profil-phone').value,
              country_of_residence: document.getElementById('profil-country').value,
              city: document.getElementById('profil-city').value,
              address: document.getElementById('profil-address').value,
              blood_type: document.getElementById('profil-blood-type').value || null,
              weight_kg: weightRaw ? parseFloat(weightRaw) : null,
              allergies: document.getElementById('profil-allergies').value || null,
            },
          });
          fillForm(profile);
        } catch (err) {
          errorEl.textContent = 'Une erreur est survenue, réessayez.';
          errorEl.classList.remove('hidden');
        }
      });

      document.getElementById('password-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var errorEl = document.getElementById('password-error');
        var successEl = document.getElementById('password-success');
        errorEl.classList.add('hidden');
        successEl.classList.add('hidden');

        var currentPassword = document.getElementById('password-current').value;
        var newPassword = document.getElementById('password-new').value;
        var newPasswordConfirm = document.getElementById('password-new-confirm').value;
        if (!passwordsMatch(newPassword, newPasswordConfirm)) {
          errorEl.textContent = 'Les nouveaux mots de passe ne correspondent pas.';
          errorEl.classList.remove('hidden');
          return;
        }

        var submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
          await apiPost('/auth/patients/change-password', {
            current_password: currentPassword,
            new_password: newPassword,
            new_password_confirmation: newPasswordConfirm,
          });
          document.getElementById('password-form').reset();
          successEl.classList.remove('hidden');
        } catch (err) {
          errorEl.textContent = translateApiError(err);
          errorEl.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
